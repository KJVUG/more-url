        h1 {
            text-align: center;
            color: #333;

        .table-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* 允许元素换行 */
            width: 100%;
            max-width: 1000px; /* 设置一个最大宽度 */
            margin: 0 auto;
        }

        .table-column {
            width: 29%; /* 每列宽度设置为 24.5% */
            margin-bottom: 20px; /* 给每列添加底部边距 */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* 设置表格布局为固定宽度 */
            height: 130px; /* 设置表格高度 */ /* 调整高度 */
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
		tr{
			height: 50px;
		}
        /* 鼠标悬停时描述字段的颜色变深 */
        td.description:hover {
            background-color: #dcdcdc;
            cursor: pointer;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        .action-btn {
            background-color: #4CAF50;
            color: white;
            padding: 6px 12px;
            text-align: center;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #45a049;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .table-container {
                flex-direction: column; /* 小屏幕上将两列变成一列 */
            }

            .table-column {
                width: 100%; /* 每一列宽度变为 100% */
                margin-bottom: 20px; /* 给每列添加底部边距 */
            }

            table {
                font-size: 14px;
            }

            .action-btn {
                padding: 4px 8px;
            }
        }

        /* 搜索框样式 */
        #searchInput {
            width: 100%; /* 设置搜索框宽度为100% */
            padding: 10px;
            margin: 20px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* 确保padding不会影响宽度 */
        }

        /* 添加新的样式来调整间距 */
        .table-container > div { /* 选择 table-container 的直接子元素 */
            margin-right: 20px; /* 给每个子元素添加 20px 右边距 */
        }

        .table-container > div:last-child { /* 选择最后一个子元素 */
            margin-right: 0; /* 最后一个子元素不需要右边距 */
        }
    </style>
    <script>
        function openUrl(url) {
            try {
                if (!url.startsWith('http')) {
                    url = 'https://' + url;
                }
                window.open(url, '_blank');
                return 0; // 成功
            } catch (error) {
                console.error('无法打开网址:', error);
                return 1; // 失败
            }
        }

        // 实现搜索功能
        function searchDescription() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let tables = document.querySelectorAll('tbody');
            let rows;

            for (let i = 0; i < tables.length; i++) {
                rows = tables[i].getElementsByTagName('tr');
                for (let j = 0; j < rows.length; j++) {
                    let descCell = rows[j].getElementsByTagName('td')[0]; // 现在描述字段在第一个单元格
                    if (descCell) {
                        let descText = descCell.textContent || descCell.innerText;
                        if (descText.toLowerCase().indexOf(input) > -1) {
                            rows[j].style.display = '';
                        } else {
                            rows[j].style.display = 'none';
                        }
                    }
                }
            }
        }
    </script>
</head>
